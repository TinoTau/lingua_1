[server]
port = 8081
host = "0.0.0.0"

[scheduler]
url = "ws://localhost:5010/ws/session"
http_base_url = "http://localhost:5010"
# Prefer env LINGUA_CORRECTION_API_TOKEN; optional inline for local only:
# correction_api_token = "dev-token"

[rate_limit]
default_max_rps = 100
default_max_sessions = 10

[tenant]

[persistence]
user_profile_db_path = "data/user_profiles.sqlite3"
# Read-only Lexicon SSOT for Stage D lexical writeback (exact surface → term_id → term_domain_tags).
lexicon_db_path = "../../node_runtime/lexicon/v3/lexicon.sqlite"
